name: macos

on:
  push:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec.yaml
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)
          test -n "$version" || { echo "pubspec.yaml has no 'version: x.y.z' line"; exit 1; }
          echo "CARINA_VERSION=$version" >> "$GITHUB_ENV"
          echo "Carina $version, build ${{ github.run_number }}"

      - name: Flutter pub get
        run: |
          flutter config --enable-macos-desktop --no-analytics
          flutter --version
          flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --build-number=${{ github.run_number }}

      # Optional secrets: MACOS_CERT_P12_BASE64 (Developer ID Application
      # certificate + key), MACOS_CERT_PASSWORD, and for notarization
      # ASC_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID. Without them the app
      # stays ad-hoc signed and testers open it with right-click > Open.
      - name: Sign and notarize
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "::warning::No MACOS_CERT_P12_BASE64 secret: the app stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/carina-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application/ { print $2; exit }')
          test -n "$identity" || { echo "No Developer ID Application identity in the certificate"; exit 1; }

          if [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
            export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          fi
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          tools/macos/sign_and_notarize.sh "$app" "$identity"
          echo "CARINA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "${ASC_KEY_PATH:-}" ]; then
            echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          fi

      # Drag-to-Applications disk image (layout: tools/macos/dmg/settings.py).
      # Signed and notarized like the app when the secrets are set.
      - name: Package DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "No .app in build/macos/Build/Products/Release"; exit 1; }
          codesign --verify --deep --verbose=1 "$app" || true
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "^Authority=|^TeamIdentifier=" || true
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          mkdir -p dist
          dmg="dist/Carina-$CARINA_VERSION-${{ github.run_number }}-macos.dmg"
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s tools/macos/dmg/settings.py \
            -D app="$app" "Carina" "$dmg"
          if [ -n "${CARINA_SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$CARINA_SIGN_IDENTITY" "$dmg"
            if [ -n "${ASC_KEY_PATH:-}" ]; then
              tools/macos/notarize.sh "$dmg"
              xcrun stapler staple "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            fi
          fi
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l dist

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/carina-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc_key.p8"

      - name: Upload carina-macos
        uses: actions/upload-artifact@v6
        with:
          name: carina-macos
          path: dist/
          if-no-files-found: error
          compression-level: 0
