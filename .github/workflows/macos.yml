name: macos

on:
  push:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version from pubspec.yaml
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)
          test -n "$version" || { echo "pubspec.yaml has no 'version: x.y.z' line"; exit 1; }
          echo "CARINA_VERSION=$version" >> "$GITHUB_ENV"
          echo "Carina $version, build ${{ github.run_number }}"

      - name: Flutter pub get
        run: |
          flutter config --enable-macos-desktop --no-analytics
          flutter --version
          flutter pub get

      # Ad-hoc signed (no Developer ID yet): testers open it with
      # right-click > Open, or allow it under Privacy & Security.
      - name: Build macOS app
        run: flutter build macos --release --build-number=${{ github.run_number }}

      - name: Package zip
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "No .app in build/macos/Build/Products/Release"; exit 1; }
          codesign --verify --deep --verbose=1 "$app" || true
          mkdir -p dist
          zip="dist/Carina-$CARINA_VERSION-${{ github.run_number }}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l dist

      - name: Upload carina-macos
        uses: actions/upload-artifact@v6
        with:
          name: carina-macos
          path: dist/
          if-no-files-found: error
          compression-level: 0
