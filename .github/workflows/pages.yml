name: pages

# Publishes the Turkish download page (site/) to GitHub Pages:
# https://egemenmermer.github.io/carina/ (Android TV shortcut: /tv/).
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - assets/brand/carina_icon_1024.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/images _site/images
          cp assets/brand/carina_icon_1024.png _site/icon.png
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
