name: webos

on:
  push:
    paths:
      - 'webos/**'
      - '.github/workflows/webos.yml'
  workflow_dispatch:

concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: webos

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json

      # package.json "version": "0.1.0" -> CARINA_VERSION=0.1.0 (also written
      # into appinfo.json by the build).
      - name: Read version from package.json
        run: |
          version=$(node -p "require('./package.json').version")
          echo "CARINA_VERSION=$version" >> "$GITHUB_ENV"
          echo "Carina for webOS $version, build ${{ github.run_number }}"

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds dist/ and packs it with ares-package into out/*.ipk.
      - name: Build IPK
        run: |
          npm run package
          mkdir -p ../dist-webos
          for f in out/*.ipk; do
            cp "$f" "../dist-webos/Carina-$CARINA_VERSION-${{ github.run_number }}-webos.ipk"
          done
          (cd ../dist-webos && sha256sum *.ipk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l ../dist-webos

      - name: Upload carina-webos
        uses: actions/upload-artifact@v6
        with:
          name: carina-webos
          path: dist-webos/
          if-no-files-found: error
          compression-level: 0
